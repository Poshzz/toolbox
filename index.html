<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./pwa-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4EDDE" />
    <meta name="apple-mobile-web-app-title" content="Toolbox" />
    <meta
      name="description"
      content="Toolbox — กล่องเครื่องมือออนไลน์ 42 รายการ: ข้อความ ไฟล์ รูปภาพ PDF ไทย เดฟ การเงิน — ทำงานในเบราว์เซอร์ 100% และใช้แบบออฟไลน์ได้"
    />
    <title>Toolbox — กล่องเครื่องมือออนไลน์</title>
    <script>
      // ตั้งธีมก่อน paint แรก (กันจอวาบสว่างผิด) — ค่าที่เคยเลือก > ค่าตามระบบ
      ;(function () {
        var t = null
        try {
          var s = localStorage.getItem('toolbox-theme')
          if (s === 'dark' || s === 'light') t = s
        } catch (e) {}
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (t === 'dark') {
          document.documentElement.classList.add('dark')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#16100a')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
